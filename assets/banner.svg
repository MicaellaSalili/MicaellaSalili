<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="3" fill="#000000" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- hard offset shadow -->
  <rect x="18" y="18" width="874" height="194" rx="26" fill="#000000"/>

  <!-- main card -->
  <rect x="8" y="8" width="874" height="194" rx="26" fill="#FFE600" stroke="#000000" stroke-width="6"/>
  <rect x="8" y="8" width="874" height="194" rx="26" fill="url(#dots)"/>

  <!-- accent shapes, pop-art energy -->
  <circle cx="80" cy="45" r="16" fill="#FF3E9E" stroke="#000000" stroke-width="3.5">
    <animate attributeName="r" values="16;19;16" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="815" cy="50" r="12" fill="#00D4FF" stroke="#000000" stroke-width="3">
    <animate attributeName="r" values="12;15;12" dur="2s" repeatCount="indefinite" begin="0.5s" />
  </circle>
  <rect x="60" y="165" width="34" height="34" rx="8" fill="#8B5CF6" stroke="#000000" stroke-width="3.5" transform="rotate(-12 77 182)">
    <animateTransform attributeName="transform" type="rotate" values="-12 77 182; 8 77 182; -12 77 182" dur="3.6s" repeatCount="indefinite" />
  </rect>
  <rect x="780" y="150" width="40" height="40" rx="10" fill="#B6FF3E" stroke="#000000" stroke-width="3.5" transform="rotate(10 800 170)">
    <animateTransform attributeName="transform" type="rotate" values="10 800 170; -10 800 170; 10 800 170" dur="3.2s" repeatCount="indefinite" />
  </rect>

  <!-- name -->
  <text x="450" y="105" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">MICAELLA SALILI</text>

  <!-- tagline pill -->
  <rect x="146" y="140" width="612" height="6" fill="#000000" opacity="0"/>
  <g>
    <animateTransform attributeName="transform" type="scale" values="1;1.015;1" dur="2.8s" repeatCount="indefinite" additive="sum" />
    <rect x="146" y="136" width="608" height="42" rx="21" fill="#000000"/>
    <rect x="140" y="130" width="608" height="42" rx="21" fill="#FF3E9E" stroke="#000000" stroke-width="4"/>
    <text x="450" y="157" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FULL-STACK + SOFTWARE DESIGN + APPLIED AI</text>
  </g>
</svg>
