<svg width="620" height="62" viewBox="0 0 620 62" xmlns="http://www.w3.org/2000/svg">

  <!-- shadow (sharp rectangle) — offset 6px right+down -->
  <rect id="pill-shadow" x="8" y="8" width="608" height="44" rx="0" fill="#000000">
    <animate attributeName="x" values="8;10;8" dur="1.8s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="y" values="8;10;8" dur="1.8s" repeatCount="indefinite" begin="0.6s"/>
  </rect>

  <!-- face — inset by stroke-width/2 (2px) on every side so stroke is never clipped -->
  <rect id="pill-face" x="2" y="2" width="606" height="44" rx="0" fill="#FF3E9E" stroke="#000000" stroke-width="4">
    <animate attributeName="x" values="2;4;2" dur="1.8s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="y" values="2;4;2" dur="1.8s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="fill" values="#FF3E9E;#8B5CF6;#00D4FF;#B6FF3E;#FFE600;#FF3E9E" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  </rect>

  <!-- label -->
  <text id="pill-text" x="307" y="24" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.5">
    FULL-STACK + SOFTWARE DESIGN + APPLIED AI
    <animate attributeName="x" values="307;309;307" dur="1.8s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="y" values="24;26;24" dur="1.8s" repeatCount="indefinite" begin="0.6s"/>
  </text>

  <!-- pointer cursor -->
  <g id="cursor">
    <animateTransform attributeName="transform" type="translate"
      values="460,80; 315,22; 315,26; 315,22; 460,80"
      keyTimes="0; 0.35; 0.45; 0.55; 1"
      dur="1.8s" repeatCount="indefinite" begin="0s"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <polygon points="0,0 0,22 6,17 10,26 13,25 9,16 16,16" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="8" cy="10" r="0" fill="none" stroke="#FF3E9E" stroke-width="2.5" opacity="0">
      <animate attributeName="r" values="0;0;0;18;26" keyTimes="0;0.34;0.44;0.55;0.7" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;0.8;0" keyTimes="0;0.34;0.44;0.55;0.7" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#FF3E9E;#8B5CF6;#00D4FF;#B6FF3E;#FFE600;#FF3E9E" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
  </g>
</svg>
